<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZALINEL">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1117">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ZALINEL Terreno</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap');

:root{
  --bg:#0e1117;
  --surface:#161b24;
  --surface2:#1d2535;
  --border:#2a3347;
  --text:#d4dce8;
  --head:#ffffff;
  --dim:#7a8ba0;
  --faint:#4a5a70;
  --accent:#f0a500;
  --ok:#3bbf7a;
  --info:#3b8bbf;
  --r:8px;
  --mono:'Share Tech Mono',monospace;
  --sans:'Barlow',sans-serif;
  --cond:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{min-height:100%;background:var(--bg);}
body{
  min-height:100vh;background:
    radial-gradient(circle at 50% -12%, rgba(240,165,0,.16), transparent 34%),
    linear-gradient(180deg,#111722 0%,#0e1117 48%,#0b0f15 100%);
  color:var(--text);font-family:var(--sans);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
}
.app{
  width:min(520px,100%);margin:0 auto;min-height:calc(100vh - 38px);
  display:grid;grid-template-rows:auto 1fr auto;gap:18px;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand img{width:44px;height:44px;border-radius:10px;box-shadow:0 0 0 1px rgba(240,165,0,.35),0 12px 28px rgba(0,0,0,.28);}
.brand-title{font-family:var(--cond);font-size:25px;font-weight:800;letter-spacing:.12em;color:var(--accent);line-height:.95;}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;}
.status{
  font-family:var(--mono);font-size:10px;color:var(--ok);
  border:1px solid rgba(59,191,122,.32);background:rgba(59,191,122,.09);
  border-radius:999px;padding:5px 10px;white-space:nowrap;
}
.main{align-self:center;display:grid;gap:16px;}
.hero{display:grid;gap:8px;padding:8px 2px 2px;}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
h1{
  font-family:var(--cond);font-size:42px;line-height:.95;color:var(--head);
  letter-spacing:.02em;text-transform:uppercase;font-weight:800;
}
.hero p{font-size:15px;line-height:1.45;color:var(--dim);max-width:32rem;}
.module-grid{display:grid;gap:10px;}
.module-card{
  display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;
  min-height:84px;padding:12px;border-radius:var(--r);text-decoration:none;color:inherit;
  background:linear-gradient(180deg,rgba(29,37,53,.96),rgba(22,27,36,.96));
  border:1px solid var(--border);border-left:4px solid var(--info);
  box-shadow:0 14px 30px rgba(0,0,0,.18);
}
.module-card:active{border-color:rgba(240,165,0,.75);transform:translateY(1px);}
.module-icon{
  width:58px;height:58px;border-radius:var(--r);display:grid;place-items:center;
  background:rgba(59,139,191,.14);border:1px solid rgba(59,139,191,.38);
  color:#9fd4ff;font-size:26px;
}
.module-label{font-family:var(--cond);font-size:18px;font-weight:800;letter-spacing:.06em;color:var(--head);text-transform:uppercase;}
.module-copy{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35;}
.module-arrow{font-family:var(--mono);font-size:22px;color:var(--accent);}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.slot{
  min-height:72px;border:1px dashed rgba(122,139,160,.28);border-radius:var(--r);
  display:grid;align-content:center;gap:4px;padding:10px;background:rgba(22,27,36,.42);
}
.slot strong{font-family:var(--cond);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);}
.slot span{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;}
.footer{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding-top:4px;}
@media(max-width:380px){
  body{padding-left:12px;padding-right:12px;}
  h1{font-size:36px;}
  .brand-title{font-size:22px;}
  .status{display:none;}
  .module-card{grid-template-columns:52px 1fr auto;}
  .module-icon{width:52px;height:52px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="icon-192.png" alt="ZALINEL">
      <div>
        <div class="brand-title">ZALINEL</div>
        <div class="brand-sub">Terreno</div>
      </div>
    </div>
    <div class="status">Suite conectada</div>
  </header>

  <main class="main">
    <section class="hero">
      <div class="kicker">Quipasur · ZH780L-40</div>
      <h1>Operación en terreno</h1>
      <p>Accesos móviles para registrar realidad operacional, evidencia y continuidad de trabajo.</p>
    </section>

    <section class="module-grid" aria-label="Módulos">
      <a class="module-card" href="bitacora.html">
        <div class="module-icon" aria-hidden="true">▤</div>
        <div>
          <div class="module-label">Bitácora</div>
          <div class="module-copy">Notas, fotos, dictado y exportación hacia data/bitacora.</div>
        </div>
        <div class="module-arrow" aria-hidden="true">›</div>
      </a>
      <div class="slots" aria-label="Próximos accesos">
        <div class="slot"><strong>QR</strong><span>Próximo</span></div>
        <div class="slot"><strong>Checklist</strong><span>Próximo</span></div>
      </div>
    </section>
  </main>

  <footer class="footer">ZALINEL SpA · Mobile Suite</footer>
</div>
</body>
</html>
